<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Vessel Report - BI Vessel Departure & CUL Voyage</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6f7; }
.tab-nav { display: flex; gap: 0; background: #1a73e8; padding: 0 20px; }
.tab-btn { padding: 14px 28px; background: rgba(255,255,255,0.1); border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); transition: all 0.2s; border-right: 1px solid rgba(255,255,255,0.15); }
.tab-btn:hover { background: rgba(255,255,255,0.2); color: white; }
.tab-btn.active { background: white; color: #1a73e8; }
.tab-content { display: none; width: 100%; height: calc(100vh - 49px); }
.tab-content.active { display: block; }
iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<div class="tab-nav">
<button class="tab-btn active" data-tab="departure" onclick="switchTab('departure')">BI Vessel Departure</button>
<button class="tab-btn" data-tab="voyage" onclick="switchTab('voyage')">CUL Voyage Report</button>
</div>

<div id="tab-departure" class="tab-content active">
<iframe id="iframe-departure" src="https://leahliul.github.io/Schedule-Simulation/cul_rex_schedule.html"></iframe>
</div>

<div id="tab-voyage" class="tab-content">
<iframe id="iframe-voyage" src="./voyage_report.html"></iframe>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
</script>
</body>
</html>
